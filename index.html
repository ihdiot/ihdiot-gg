<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070608">
  <meta name="description" content="IHDIOT — reviews and gaming lifestyle. Talky, YouTube, Discord, Garage Coach.">
  <title>IHDIOT — Reviews + Gaming Lifestyle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#doors">Skip to destinations</a>

  <div class="scroll-track" id="hub">
    <div class="stage" id="stage" role="img" aria-label="A dark cozy desk room. Wide-tracked IHDIOT type floats over a mesh chair, monitor, and a pink neon rope light. Scroll to move through the room.">
      <div class="layer layer-wall" data-depth="wall" aria-hidden="true">
        <img class="plate is-on" data-plate="0" src="assets/plates/s1-hero.jpg" alt="">
        <img class="plate" data-plate="1" src="assets/plates/s2-mid.jpg" alt="">
        <img class="plate" data-plate="2" src="assets/plates/s3-sticky.jpg" alt="">
        <img class="plate" data-plate="3" src="assets/plates/s4-doors.jpg" alt="">
      </div>

      <div class="layer layer-neon" data-depth="neon" aria-hidden="true">
        <svg class="neon-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <filter id="neon-soft" x="-20%" y="-80%" width="140%" height="260%">
              <feGaussianBlur stdDeviation="7" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="neon-pink" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ff4d9a" stop-opacity=".15"/>
              <stop offset=".45" stop-color="#ff2f86"/>
              <stop offset=".7" stop-color="#ff5aad"/>
              <stop offset="1" stop-color="#ff3d8a" stop-opacity=".2"/>
            </linearGradient>
          </defs>
          <path class="neon-halo" d="M-80 548 C 180 470, 380 610, 640 528 S 980 430, 1240 540 S 1500 610, 1760 500"/>
          <path class="neon-rope" d="M-80 548 C 180 470, 380 610, 640 528 S 980 430, 1240 540 S 1500 610, 1760 500"/>
        </svg>
      </div>

      <div class="layer layer-desk" data-depth="desk" aria-hidden="true">
        <img class="plate is-on" data-plate="0" src="assets/plates/s1-hero.jpg" alt="">
        <img class="plate" data-plate="1" src="assets/plates/s2-mid.jpg" alt="">
        <img class="plate" data-plate="2" src="assets/plates/s3-sticky.jpg" alt="">
        <img class="plate" data-plate="3" src="assets/plates/s4-doors.jpg" alt="">
      </div>

      <div class="layer layer-type" data-depth="type">
        <nav class="nav-ghost" aria-label="Open destinations">
          <a href="https://ihdiot.github.io/talky-releases/" target="_blank" rel="noopener noreferrer">Talky</a>
          <a href="https://www.youtube.com/@ihdiot" target="_blank" rel="noopener noreferrer">YouTube</a>
          <a href="#discord" aria-label="Discord — invite coming soon">Discord</a>
          <a href="coach/" target="_blank" rel="noopener noreferrer">Coach</a>
        </nav>

        <div class="wordmark-block" id="wordmark-block">
          <h1 class="wordmark" aria-label="IHDIOT"><span aria-hidden="true">IHDIOT</span></h1>
          <p class="subtitle">REVIEWS + GAMING LIFESTYLE</p>
          <p class="racing"><i></i><span>RACING</span></p>
        </div>

        <nav class="pill" id="doors" aria-label="Soft-pill doors">
          <a class="door" data-door="0" href="https://ihdiot.github.io/talky-releases/" target="_blank" rel="noopener noreferrer">Talky</a>
          <span class="sep" aria-hidden="true">—</span>
          <a class="door" data-door="1" href="https://www.youtube.com/@ihdiot" target="_blank" rel="noopener noreferrer">YouTube</a>
          <span class="sep" aria-hidden="true">—</span>
          <a class="door" data-door="2" href="#discord" aria-label="Discord — invite coming soon">Discord</a>
          <span class="sep" aria-hidden="true">—</span>
          <a class="door" data-door="3" href="coach/" target="_blank" rel="noopener noreferrer">Coach</a>
        </nav>
      </div>

      <div class="layer layer-fg" data-depth="fg" aria-hidden="true">
        <div class="fg-lip"></div>
        <svg class="fg-cans" viewBox="0 0 220 260" fill="none">
          <path d="M40 118c8-46 38-74 72-74s62 26 70 74" stroke="#0a090b" stroke-width="14" stroke-linecap="round"/>
          <rect x="22" y="108" width="44" height="78" rx="16" fill="#0c0b0e"/>
          <rect x="154" y="108" width="44" height="78" rx="16" fill="#0c0b0e"/>
        </svg>
      </div>

      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <p class="scroll-hint" id="scroll-hint">Scroll</p>
    </div>
  </div>

  <section class="after-note" id="discord">
    <p class="after-kicker">Discord</p>
    <p>Invite is not live yet. This door is a placeholder until Brett drops the link.</p>
    <p><a href="coach/">Garage Coach</a> is a quiet stub in the meantime.</p>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
