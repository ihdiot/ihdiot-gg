<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070608">
  <meta name="description" content="Garage Coach — a quiet workout stub from IHDIOT.">
  <title>IHDIOT — Garage Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root { --void:#070608; --paper:#f3f1ec; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--paper); font-family: Outfit, "Helvetica Neue", sans-serif; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 2.5rem 1.4rem 3rem; }
    main { max-width: 28rem; text-align: center; }
    .mark {
      margin: 0 0 2.4rem;
      font-weight: 400;
      letter-spacing: 0.58em;
      text-indent: 0.58em;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      text-shadow: 0 0 18px rgba(255,255,255,.28);
    }
    h1 {
      margin: 0 0 0.8rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: 2.1rem;
    }
    p { margin: 0 0 1rem; color: rgba(243,241,236,.55); font-weight: 300; line-height: 1.6; }
    a { color: rgba(243,241,236,.82); }
    .back { display: inline-block; margin-top: 1.6rem; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="mark" aria-label="IHDIOT">IHDIOT</p>
    <h1>Garage Coach</h1>
    <p>A $1 / free workout idea for the time between sessions. No live URL yet — this is the placeholder door.</p>
    <p>We are still tuning the engine.</p>
    <a class="back" href="../">Back to the room</a>
  </main>
</body>
</html>
